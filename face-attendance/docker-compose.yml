# Runs the app only, listening on this computer's port 8000. HTTPS is provided by Tailscale Funnel
# (`sudo tailscale funnel --bg 8000`), see README.md.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - modelcache:/root/.insightface      # face model (downloaded once)
volumes:
  modelcache: {}
